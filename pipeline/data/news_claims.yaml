- id: parking-prices
  topic: parking
  label: not_in_budget
  sources:
    - {article: fox6-overview, quote: "increasing parking ticket fines by $10, increasing downtown metered parking from $2.25-per-hour to $3-per-hour, and doubling the cost of overnight parking permits"}
    - {article: wisn-parking, quote: "overnight parking permits would double from $55 to $110 annually"}
    - {article: um-streets, quote: "Downtown parking meters would increase from a minimum of $2.25 per hour to $3."}
  budget: {text: "The budget documents don't print the new prices. They estimate Transportation Fund revenue: parking citations $14,000,000 in 2026 and $21,000,000 proposed for 2027; permits $3,350,000 and $6,000,000; meters $4,634,000 and $6,178,000.", cite: {doc: summary, pdf_page: 200, printed_page: "190"}}
  reviewed_by: "Tarik (claude-precheck)"

- id: fees-3pct
  topic: taxes-fees
  label: rounded
  sources: [{article: wisn-parking, quote: "a 3% increase in city service fees like trash services and snow removal"}]
  budget: {text: "Solid waste fee $271.80 to $280.00 a year; snow and ice $1.19 to $1.23 per foot of frontage; street lighting $1.12 to $1.16 per foot.", cite: {doc: summary, pdf_page: 169, printed_page: "159"}}
  note: "Increases of 3.0% to 3.6% (our calculation from these figures)."
  reviewed_by: "Tarik (claude-precheck)"

- id: property-tax-3pct
  topic: taxes-fees
  label: different_measure
  sources: [{article: wisn-parking, quote: "a three percent increase in property taxes, which for an average homeowner in Wisconsin is about $45.50 a year"}]
  budget: {text: "The city property tax levy would go from $336,820,871 to $343,557,288, and the city tax rate from $7.61 to $7.29 per thousand dollars of assessed value.", cite: {doc: summary, pdf_page: 17, printed_page: "7"}}
  note: "The city levy rises 2.0% (our calculation). The budget doesn't state a change for an average homeowner's bill, which also includes school, county, sewerage district and technical college taxes."
  reviewed_by: "Tarik (claude-precheck)"

