# "Find it in the budget" (docs/09 step 3): specific figures from news coverage set beside what the
# budget documents print. Labels describe the relationship, never judge the reporting:
#   matches · rounded · not_in_budget · different_measure
# budget.text must only contain figures printed on budget.cite's page (validate/test_news_claims.py).
# Percentages we worked out ourselves go in `note`, labeled. reviewed_by null = not shown on the site.

- id: total-fox6
  topic: taxes-fees
  label: rounded
  sources: [{article: fox6-overview, quote: "Milwaukee mayor introduces $2.2 billion budget proposal for 2027"}]
  budget: {text: "All city funds, 2027 proposed: $2,261,087,412.", cite: {doc: summary, pdf_page: 17, printed_page: "7"}}
  note: "About $2.26 billion; the headline rounds down."
  reviewed_by: "Tarik (claude-precheck)"

