# Glossary seed (P1.7): plain-language definitions of terms the 2027 Proposed budget uses.
#
# Rules: neutral; no amounts (numbers come from the structured data, never from a definition);
# `cite_text` is the exact phrase printed on the cited page (a test checks it). `definition_source: ours`
# marks a definition the document never states (the cite is only where the term is used). Summary pdf_page =
# printed page + 10. Drafted by Claude 2026-09-22 — reviewed_by null until a human reviews.

- {term: "Proposed budget", cite_text: "Proposed Budget", cite: {doc: summary, pdf_page: 11, printed_page: "1"}, plain_definition: "The Mayor's budget plan for next year, sent to the Common Council. The Council can change it before adopting it.", why_it_matters: "Every number in this tool is the Mayor's proposal, not the final budget.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Requested budget", cite_text: "requested budget", cite: {doc: summary, pdf_page: 15, printed_page: "5"}, plain_definition: "What each department asked for before the Mayor's office decided what to propose.", why_it_matters: "Comparing requested with proposed shows where the Mayor cut or added.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Adopted budget", cite_text: "Adopted Budget", cite: {doc: summary, pdf_page: 18, printed_page: "8"}, plain_definition: "The budget the Common Council passed. In this document, '2026 Adopted' is this year's final budget.", why_it_matters: "It is the usual comparison point for 'up' or 'down'.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Actual expenditures", cite_text: "Actual", cite: {doc: summary, pdf_page: 126, printed_page: "116"}, definition_source: ours, cite_role: "where the term appears as a column header; the Summary never defines it", plain_definition: "What a department actually spent in a completed year (in this budget, 2025), as opposed to what was budgeted for it.", why_it_matters: "Budgets and spending can differ; actuals show what happened.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "General City Purposes", cite_text: "General City Purposes", cite: {doc: summary, pdf_page: 17, printed_page: "7"}, plain_definition: "The main part of the city budget that pays for most departments, such as police, fire, public works, libraries and health.", why_it_matters: "'The city budget' often means this part, not all funds together. Totals should say which one.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "All funds", cite_text: "TOTAL", cite: {doc: summary, pdf_page: 17, printed_page: "7"}, plain_definition: "Every part of the city budget added together: general city purposes plus retirement, capital, debt, the contingent fund and the special funds.", why_it_matters: "It is a much bigger number than general city purposes, so scope matters.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Budget section", cite_text: "GENERAL CITY PURPOSES", cite: {doc: summary, pdf_page: 17, printed_page: "7"}, plain_definition: "The budget is divided into lettered sections (A for general city purposes, B for employee retirement, C for capital improvements, and so on).", why_it_matters: "Section letters appear in tables and help place a number in context.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Property tax levy", cite_text: "Tax Levy", cite: {doc: summary, pdf_page: 17, printed_page: "7"}, plain_definition: "The total amount the city plans to raise from property taxes.", why_it_matters: "The levy is set by the budget; each property's share depends on its assessed value.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Tax rate", cite_text: "Tax Rate", cite: {doc: summary, pdf_page: 17, printed_page: "7"}, plain_definition: "The city property tax charged for each thousand dollars of a property's assessed value.", why_it_matters: "The rate can fall while the levy rises, if total assessed value grows faster.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Assessed value", cite_text: "Assessed Value", cite: {doc: summary, pdf_page: 17, printed_page: "7"}, plain_definition: "The value the city assigns to a property for tax purposes.", why_it_matters: "It is what the tax rate is applied to.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Non-levy funding", cite_text: "Non Tax Levy Funding", cite: {doc: summary, pdf_page: 17, printed_page: "7"}, plain_definition: "Money for a budget section that does not come from property taxes, such as state aid, fees, grants and borrowing.", why_it_matters: "Most city spending is not paid for by the property tax levy.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "State Shared Revenue", cite_text: "State Shared Revenue", cite: {doc: summary, pdf_page: 11, printed_page: "1"}, plain_definition: "Money the State of Wisconsin gives the city each year to help pay for local services.", why_it_matters: "The budget introduction describes it as a major factor in the city's finances.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Act 12", cite_text: "Act 12", cite: {doc: summary, pdf_page: 14, printed_page: "4"}, plain_definition: "A 2023 state law that allowed Milwaukee to add a local sales tax and changed State Shared Revenue, with conditions on how the city uses the money.", why_it_matters: "Several spending requirements in this budget come from Act 12.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Local sales tax", cite_text: "sales tax", cite: {doc: summary, pdf_page: 14, printed_page: "4"}, plain_definition: "The city's own sales tax on purchases in Milwaukee, authorized by Act 12.", why_it_matters: "The document says part pays for police and fire and the rest for pensions.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Expenditure Restraint Incentive Program (ERIP)", cite_text: "Expenditure Restraint Program", cite: {doc: summary, pdf_page: 168, printed_page: "158"}, also_cite: [{doc: summary, pdf_page: 15, printed_page: "5"}, {doc: summary, pdf_page: 170, printed_page: "160"}], aliases: ["Expenditure Restraint Incentive Program", "Expenditure Restraint Program", "Expenditure Restraint Aid"], plain_definition: "A state program that pays cities that keep general fund spending growth within a limit: inflation plus 60% of net new construction.", why_it_matters: "The introduction ties part of this year's reductions to qualifying for this aid.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Tax Stabilization Fund", cite_text: "Tax Stabilization Fund", cite: {doc: summary, pdf_page: 169, printed_page: "159"}, plain_definition: "A city savings fund built from unspent money and revenue surpluses, used to keep the tax rate steady.", why_it_matters: "Withdrawals from it help balance the budget without raising the levy as much.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Budget gap", cite_text: "budget gap", cite: {doc: summary, pdf_page: 11, printed_page: "1"}, plain_definition: "The difference between what it would cost to keep providing current city services next year and the revenue the city expects to have. The city calculates it each spring and calls it the requested budget gap.", why_it_matters: "The introduction explains how this year's gap was closed.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Structural deficit", cite_text: "structural deficit", cite: {doc: summary, pdf_page: 11, printed_page: "1"}, plain_definition: "A gap that comes back every year because ongoing costs grow faster than ongoing revenue.", why_it_matters: "The document says it will persist unless revenues or requirements change.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Appropriation", cite_text: "Appropriation", cite: {doc: summary, pdf_page: 18, printed_page: "8"}, plain_definition: "Permission in the budget to spend a set amount for a set purpose.", why_it_matters: "Budget figures are limits on spending, not money already spent.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Source of funds", cite_text: "SOURCE OF FUNDS", cite: {doc: summary, pdf_page: 166, printed_page: "156"}, plain_definition: "The revenues that pay for a part of the budget.", why_it_matters: "Shows where the money comes from, not just where it goes.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Intergovernmental revenue", cite_text: "Intergovernmental Revenue", cite: {doc: summary, pdf_page: 167, printed_page: "157"}, plain_definition: "Money from other governments, mainly state aid formulas and programs.", why_it_matters: "It is the largest revenue category for general city purposes.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Charges for services", cite_text: "Charges for Services", cite: {doc: summary, pdf_page: 168, printed_page: "158"}, also_cite: [{doc: summary, pdf_page: 169, printed_page: "159", cite_text: "charged to city property owners"}], plain_definition: "Revenue from fees for services city departments provide, such as garbage collection, snow and ice control and street lighting, many charged to property owners according to use.", why_it_matters: "The document describes growing reliance on these user fees.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Payment in lieu of taxes (PILOT)", cite_text: "Payment in Lieu of Taxes", cite: {doc: summary, pdf_page: 170, printed_page: "160"}, plain_definition: "A payment to the city from an organization that does not pay property tax, made instead of that tax.", why_it_matters: "It appears as its own revenue line.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Solid waste fee", cite_text: "solid waste fee", cite: {doc: summary, pdf_page: 169, printed_page: "159"}, plain_definition: "An annual charge on residential units that pays for garbage collection and related services such as recycling and special collections.", why_it_matters: "It is one of the city charges a household pays directly.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Full-time equivalent (FTE)", cite_text: "Full Time Equivalent", cite: {doc: summary, pdf_page: 13, printed_page: "3"}, plain_definition: "A way to count staff time: one FTE is one full-time job; two half-time jobs are also one FTE.", why_it_matters: "FTEs and positions are different counts and can move differently.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Position", cite_text: "Positions", cite: {doc: summary, pdf_page: 23, printed_page: "13"}, plain_definition: "A job the budget authorizes a department to fill, whether or not someone currently holds it.", why_it_matters: "An eliminated position is not necessarily a layoff; it may be vacant.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "O&M FTEs", cite_text: "O&M FTE'S", cite: {doc: detailed, pdf_page: 3, printed_page: "110.1"}, plain_definition: "Staff time paid for by the department's regular operating and maintenance budget.", why_it_matters: "Separates regularly funded staff from grant- or project-funded staff.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Salaries and wages", cite_text: "Salaries and Wages", cite: {doc: summary, pdf_page: 126, printed_page: "116"}, plain_definition: "Pay for city employees.", why_it_matters: "It is usually a department's largest cost.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Fringe benefits", cite_text: "Fringe Benefit", cite: {doc: summary, pdf_page: 126, printed_page: "116"}, plain_definition: "Employee costs on top of pay, such as health insurance and pensions.", why_it_matters: "They add substantially to the cost of each position.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Operating expenditures", cite_text: "Operating Expenditures", cite: {doc: summary, pdf_page: 126, printed_page: "116"}, plain_definition: "Day-to-day costs other than pay and benefits, such as supplies, utilities and outside services.", why_it_matters: "A common place to find contract and consultant spending.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Equipment purchases", cite_text: "Equipment", cite: {doc: summary, pdf_page: 126, printed_page: "116"}, plain_definition: "Buying or replacing equipment such as vehicles, computers or tools.", why_it_matters: "Can swing a lot from year to year.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Special funds", cite_text: "Special Funds", cite: {doc: summary, pdf_page: 126, printed_page: "116"}, plain_definition: "Money set aside in a department budget for specific programs or purposes.", why_it_matters: "Named programs often sit here.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Special purpose accounts", cite_text: "Special Purpose Account", cite: {doc: summary, pdf_page: 154, printed_page: "144"}, also_cite: [{doc: summary, pdf_page: 18, printed_page: "8"}], plain_definition: "Budget accounts for purposes outside any one department's budget, such as employee health care. The Common Council authorizes specific departments to spend from them.", why_it_matters: "Large costs can sit here instead of inside department budgets.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Capital improvements", cite_text: "Capital Improvements", cite: {doc: summary, pdf_page: 184, printed_page: "174"}, plain_definition: "Spending on long-lasting things like streets, buildings, bridges and major equipment, often paid for by borrowing.", why_it_matters: "It is budgeted separately from day-to-day operating costs.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "General obligation borrowing", cite_text: "general obligation", cite: {doc: summary, pdf_page: 15, printed_page: "5"}, plain_definition: "Borrowing the city repays from its general revenues, including property taxes.", why_it_matters: "Borrowing now adds to debt payments in future budgets.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Debt service", cite_text: "debt service", cite: {doc: summary, pdf_page: 15, printed_page: "5"}, plain_definition: "Payments of principal and interest on money the city has borrowed.", why_it_matters: "City Debt is its own budget section.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Tax incremental district (TID)", cite_text: "Tax Incremental District", cite: {doc: summary, pdf_page: 205, printed_page: "195"}, plain_definition: "An area where new property tax growth is set aside to pay for development there for a period of years.", why_it_matters: "TID revenue has its own rules and fund.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Contingent fund", cite_text: "Contingent Fund", cite: {doc: summary, pdf_page: 197, printed_page: "187"}, plain_definition: "Money the Common Council holds back for emergencies that come up during the year.", why_it_matters: "It is budgeted but not assigned to a department in advance.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Special revenue fund", cite_text: "special revenue funds", cite: {doc: summary, pdf_page: 199, printed_page: "189"}, plain_definition: "Budget sections paid for by revenue other than the city property tax levy, such as the Transportation Fund, Water Works and the Sewer Maintenance Fund.", why_it_matters: "These funds are outside general city purposes and do not run on the property tax levy.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Employes' Retirement System", cite_text: "Employes' Retirement System", cite: {doc: summary, pdf_page: 175, printed_page: "165"}, plain_definition: "The city's pension system for its employees ('Employes' is the city's spelling).", why_it_matters: "Pension contributions are a large and growing cost.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Budgetary control unit", cite_text: "BCU", cite: {doc: detailed, pdf_page: 3, printed_page: "110.1"}, plain_definition: "The level at which the Common Council controls a department's spending in the line-item budget; a unit can contain several decision units.", why_it_matters: "A department's summary pages restate its decision units, so they must not be added together.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Decision unit", cite_text: "DECISION UNIT", cite: {doc: detailed, pdf_page: 173, printed_page: "260.5"}, plain_definition: "A division or office inside a department that has its own line-item budget.", why_it_matters: "Line items are budgeted and totaled by decision unit.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Clarification of intent", cite_text: "Clarification of Intent", cite: {doc: summary, pdf_page: 222, printed_page: "212"}, plain_definition: "Notes explaining how certain budget lines are meant to be used.", why_it_matters: "Explains conditions attached to some spending.", reviewed_by: "Tarik (claude-precheck)"}
- {term: "Fringe Benefit Offset", cite_text: "Fringe Benefit Offset", cite: {doc: summary, pdf_page: 165, printed_page: "155"}, aliases: ["fringe benefit offset"], also_cite: [{doc: summary, pdf_page: 172, printed_page: "162", note: "the same name on a revenue line: other city funds' payment for their employees' benefits (explained on p.159 as the fringe benefit reimbursement)"}], plain_definition: "The budget uses this name for two different lines. On the spending side it is a negative line that removes employee benefit costs counted twice, once in special purpose accounts and again in department budgets, so the city does not levy for them twice. On the revenue side it is the payment other city funds (grants, enterprise funds, capital) make to the general fund for their employees' benefits.", why_it_matters: "The two lines are very different in size. A figure labeled 'Fringe Benefit Offset' needs its page to show which one it is.", reviewed_by: "Tarik (claude-precheck)"}
