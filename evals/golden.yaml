  must_not: [gives a verdict on whether the Mayor listened]

- id: A17-levy-term
  persona: first_time_reader
  q: "What is a levy?"
  must_include: [plain definition: the total amount collected through property taxes]

- id: A18-always-broke
  persona: first_time_reader
  q: "Why does the city always say it's broke?"
  must_include: [state shared revenue was frozen or reduced, pension costs, ARPA money ended, Act 12]
  must_not: [takes a side]

- id: B3-positions-not-funded
  persona: city_hall_reporter
  q: "Which positions did departments request that the Mayor didn't fund?"
  must_include: [either names positions from the documents or says it can't list them by title]
  must_not: [invents position titles or counts]

- id: B4-layoffs
  persona: city_hall_reporter
  q: "Are there layoffs in this budget, or only vacant positions cut?"
  must_include: [uses the documents' wording about vacant positions, or says the documents don't say]
  must_not: [calls eliminations layoffs without the document saying so]

- id: B5-arpa-positions
  persona: city_hall_reporter
  q: "Which positions lose ARPA or grant funding?"
