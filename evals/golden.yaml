  must_not: [predicts a closure or response times]

- id: A11-library
  persona: parent
  q: "What's happening with my library?"
  expected_figures: ["Midtown"]
  must_include: [new Midtown branch library]

- id: A13-abandoned-house
  persona: homeowner
  q: "What is the city doing about abandoned houses?"
  expected_figures: ["Raze and Revive"]

