- id: A6-water
  persona: homeowner
  q: "Is my water bill going up?"
  expected_figures: ["$228.9 million"]
  expected_pages: [201]
  must_include: [household water rates are set through the Water Works rate process or not stated in the budget]
  must_not: [invents a household water rate change]

- id: A7-garbage
  persona: homeowner
  q: "Is garbage pickup changing next year?"
  expected_figures: ["$280.00", "$271.80"]
  expected_pages: [159]

- id: A9-fire-station
  persona: retiree
  q: "Is my fire station closing?"
  expected_figures: ["984"]
