- id: D3-one-sentence
  persona: radio_host
  q: "What's the one-sentence version of this budget?"
  expected_figures: ["$2.26 billion"]
  must_include: [attributed to the Mayor's proposal]

- id: E1-under-inflation
  persona: fact_checker
  q: "The Mayor says taxes and fees are held under inflation. Is that right?"
  expected_figures: ["2%"]
  must_include: [shows the levy change and fee changes beside the claim]
  must_not: [issues a true or false verdict label]

- id: E2-defunded
  persona: fact_checker
  q: "Someone told me police are being defunded. Is that true?"
