  must_include: [Act 12 sworn staffing requirements as stated in the budget]
  must_not: [characterizes the Mayor's motives]

- id: B10-levy-split
  persona: city_hall_reporter
  q: "How much of the property tax levy goes to pensions and debt versus city services?"
