  must_not: [invents projects for a neighborhood]

- id: A15-speak-up
  persona: first_time_reader
  q: "When can I speak up about the budget?"
  expected_figures: ["November 14"]
  must_include: [a public hearing date or the Council hearing schedule, contacting an alderperson]

- id: A16-survey
  persona: first_time_reader
  q: "Did the Mayor listen to the public budget survey?"
  expected_figures: ["survey"]
