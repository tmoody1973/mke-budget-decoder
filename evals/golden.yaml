  must_include: [names at least one new item from the documents with its page]
  must_not: [invents new programs]

- id: B12-above-request
  persona: city_hall_reporter
  q: "Where did the Mayor fund more than a department asked for?"
  must_include: [names a case where proposed exceeds requested, from the data]

- id: B14-streetcar
  persona: city_hall_reporter
  q: "What is the streetcar costing and earning?"
  expected_figures: ["streetcar"]
  must_include: [streetcar figures from the documents or says the lookup doesn't have them]

- id: C2-consultants
  persona: data_reporter
  q: "How much does the city spend on consultants and professional services?"
